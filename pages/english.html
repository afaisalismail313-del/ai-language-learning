<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn English</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/english.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header english-header">
        <div class="container">
            <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
            <h1><i class="fas fa-flag-usa"></i> Learn English</h1>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <section class="lesson-section">
                <h2>Today's Lesson</h2>
                <div class="lesson-card">
                    <h3 id="lesson-title">Loading...</h3>
                    <p id="lesson-text">Preparing...</p>
                    <div class="vocabulary-list" id="vocabulary-list"></div>
                </div>
                <button class="btn btn-primary" onclick="startLesson()">Start Practice</button>
            </section>

            <section class="conversation-section">
                <h2>AI Conversation</h2>
                <div class="chat-container">
                    <div class="chat-messages" id="chat-messages">
                        <div class="message ai-message">
                            <div class="message-avatar"><i class="fas fa-robot"></i></div>
                            <div class="message-content"><p>Hello! Let's practice English!</p></div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="user-input" placeholder="Type in English..." />
                        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </section>

            <section class="tts-section">
                <h2>Pronunciation Practice</h2>
                <textarea id="practice-text" placeholder="Enter text..."></textarea>
                <button class="btn btn-primary" onclick="speakText(document.getElementById('practice-text').value)">
                    <i class="fas fa-play"></i> Listen
                </button>
            </section>

            <section class="phrases-section">
                <h2>Common Phrases</h2>
                <div class="phrases-grid" id="phrases-grid"></div>
            </section>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/english.js"></script>
</body>
</html>
